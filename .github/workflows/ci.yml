name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright Chromium (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Run linter
        run: python -m ruff check .

      - name: Run static type checker
        run: python -m mypy normalizer pageobjects parsers reporting runners tools

      - name: Run smoke tests
        run: python -m pytest -m smoke -q

      - name: Run unit and integration tests
        run: python -m pytest tests/unit tests/integration -q --basetemp=build/pytest_temp

      - name: Upload PDF evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: evidence-pdf-reports-${{ matrix.os }}
          path: build/pytest_temp/**/*.pdf
          if-no-files-found: ignore
